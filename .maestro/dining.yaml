appId: in.koreatech.koin.dev
name: 비로그인 식단 화면
---
- runFlow: common/launch_home.yaml
- openLink: "koin://dining/navigation"
- extendedWaitUntil:
    visible: "식단"
    timeout: 30000
- assertVisible: "아침"
- assertVisible: "점심"
- assertVisible: "저녁"
- tapOn: "점심"
- tapOn:
    text: "학생식당정보"
- extendedWaitUntil:
    visible: "학생식당정보"
    timeout: 15000
- assertVisible: "위치"
- assertVisible: "전화번호"
- pressKey: BACK
- extendedWaitUntil:
    visible: "아침"
    timeout: 15000
