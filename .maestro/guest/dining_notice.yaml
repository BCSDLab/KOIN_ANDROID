appId: ${APP_ID}
env:
  APP_ID: in.koreatech.koin
---
# 식단 화면 진입
- runFlow: ../common/open_drawer.yaml
- tapOn:
    id: "${APP_ID}:id/navi_item_dining"
- extendedWaitUntil:
    visible: "식단"
    timeout: 15000
- assertVisible: "식단"

# 학생식당 정보 아이콘 탭 (상단 우측)
# NOTE: Icon에 contentDescription이 없어 좌표 기반으로 탭합니다.
- tapOn:
    point: "94%, 6%"
- extendedWaitUntil:
    visible: "학생식당정보"
    timeout: 10000

# 학생식당정보 화면 확인
- assertVisible: "학생식당정보"
- assertVisible: "위치"
- assertVisible: "전화번호"

# 뒤로가기 → 식단 화면 복귀
- back
- extendedWaitUntil:
    visible: "식단"
    timeout: 10000
- assertVisible: "식단"
