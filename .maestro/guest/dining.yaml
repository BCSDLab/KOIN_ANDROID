appId: ${APP_ID}
env:
  APP_ID: in.koreatech.koin
---
# 식단 화면 진입
- runFlow: ../common/open_drawer.yaml
- tapOn:
    id: "${APP_ID}:id/navi_item_dining"
- extendedWaitUntil:
    visible: "식단"
    timeout: 15000
- assertVisible: "식단"
- assertVisible: "아침"
- assertVisible: "점심"
- assertVisible: "저녁"

# 점심 탭으로 이동
- tapOn:
    text: "점심"
- waitForAnimationToEnd
- assertVisible: "점심"

# 저녁 탭으로 이동
- tapOn:
    text: "저녁"
- waitForAnimationToEnd
- assertVisible: "저녁"

# 아침 탭으로 복귀
- tapOn:
    text: "아침"
- waitForAnimationToEnd
- assertVisible: "아침"

# 당겨서 새로고침
- swipe:
    start: "50%, 35%"
    end: "50%, 70%"
    duration: 500
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: "식단"
