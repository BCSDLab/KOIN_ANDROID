language: ko-KR
early_access: true
reviews:
  profile: chill
  request_changes_workflow: true # Approve when all comments resolved
  high_level_summary: true
  high_level_summary_placeholder: "@coderabbitai summary"
  changed_files_summary: true
  sequence_diagrams: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "**"
    - "!**/.gradle/**"
    - "!**/build/**"
    - "!**/*.generated.*"
    - "!**/gradlew"
    - "!**/gradlew.bat"
  auto_review:
    enabled: false # Trigger manually after ci finish via @coderabbit
    drafts: false
    ignore_title_keywords:
      - "release" # Do not review release PR
    base_branches:
      - develop
      - production
  tools:
    shellcheck:
      enabled: false
    ruff:
      enabled: false
    biome:
      enabled: false
    github-checks:
      enabled: true
      timeout_ms: 120000
    gitleaks:
      enabled: true
  path_instructions:
    - path: "**"
      instructions: |
        1. Kotlin 공식 스타일 및 안드로이드 공식 스타일 준수 확인
        2. return이 Unit인 경우 반환 타입 선언 생략
        3. 람다가 불필요하게 재생성되지 않도록, 내부에 선언된 외부 변수는 직접 참조하여 접근하는 방식으로 수정

    - path: domain/**
      instructions: |
        1. 순수 Kotlin/Java만 허용 (android.*, androidx.* 등 금지)
        2. Clean Architecture:
          - data/feature/koin/core 모듈 의존 금지
        3. UseCase는 단일 책임 원칙 준수 (execute/invoke 메서드 하나)
        4. Repository는 interface만 정의 (구현체 금지)

    - path: data/**
      instructions: |
        1. Clean Architecture:
          - domain 이외 모듈 의존 금지
        2. Api 엔드포인트에 따로 @Header 로 인증을 넣을 필요 없음:
          - retrofit build 과정에서 인증 정보 주입 중
        3. DataSource, Repository, RepositoryImpl 에 @Singleton 어노테이션 추가 필요 없음

    - path: koin/**
      instructions: |
        1. XML 컨벤션 준수
        2. ui 관련 문자열은 반드시 strings.xml로 분리
        3. ViewModel에서 Context 사용 금지
        4. Clean Architecture:
          - Repository 직접 접근 금지
        5. compose 함수의 parameter 에서 기본값이 존재하는 parameter 는 후반부에 선언, parameter 에 modifier 가 존재하면 기본값 parameter 중 최상단은 modifier 가 위치, 기본값이 없는 lambda 는 최하단에 선언해도 통과
        6. @Preview 가 선언된 composable 함수는 private 필수
        7. androidx.hilt:hilt-navigation-compose.hiltViewModel 가 아닌 androidx.hilt.lifecycle.viewmodel.compose.hiltViewModel 를 사용

    - path: feature/**
      instructions: |
        1. XML 컨벤션 준수
        2. ui 관련 문자열은 반드시 strings.xml로 분리
        3. ViewModel에서 Context 사용 금지
        4. Clean Architecture:
          - data 모듈 의존 금지
          - Repository 직접 접근 금지
        5. Compose 최적화를 위해 State 클래스에 @Immutable 및 ImmutableList 사용 필수
        6. compose 함수의 parameter 에서 기본값이 존재하는 parameter 는 후반부에 선언, parameter 에 modifier 가 존재하면 기본값 parameter 중 최상단은 modifier 가 위치, 기본값이 없는 lambda 는 최하단에 선언해도 통과
        7. @Preview 가 선언된 composable 함수는 private 필수
        8. androidx.hilt:hilt-navigation-compose.hiltViewModel 가 아닌 androidx.hilt.lifecycle.viewmodel.compose.hiltViewModel 를 사용

    - path: core/designsystem/**
      instructions: |
        1. 기존의 컴포넌트 수정 시, 하위 호환성 반드시 유지
        2. 컴포넌트 설계 시, 확장 가능성 고려

chat:
  auto_reply: true

knowledge_base:
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/AGENTS.md"
  learnings:
    scope: local