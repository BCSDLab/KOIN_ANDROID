name: Gradle Setup

inputs:
  properties:
    required: true
    description: local.properties secret
  firebase:
    required: true
    description: google-services.json release
  firebase_stage:
    required: true
    description: google-services.json debug

runs:
  using: "composite"
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create local.properties
      shell: bash
      env:
        PROPERTIES: ${{ inputs.properties }}
      run: echo "$PROPERTIES" | base64 -di > ./local.properties

    - name: Update Firebase
      shell: bash
      env:
        FIREBASE: ${{ inputs.firebase }}
        FIREBASE_STAGE: ${{ inputs.firebase_stage }}
      run: |
        mkdir -p ./koin/src/debug
        echo $FIREBASE | base64 -di > ./koin/google-services.json
        echo $FIREBASE_STAGE | base64 -di > ./koin/src/debug/google-services.json
        for file in $(find . -name 'google-services.json')
        do
         echo $file
        done

    - name: Gradle cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew
