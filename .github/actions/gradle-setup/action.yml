name: Gradle Setup

inputs:
  properties:
    required: true
    description: local.properties secret
  gradle-encryption-key:
    required: false
    default: ""
    description: >-
      base64 AES key to encrypt/restore the Gradle configuration-cache in the
      Actions cache. Empty = configuration-cache is not cached (no error).

runs:
  using: "composite"
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Create local.properties
      shell: bash
      env:
        PROPERTIES: ${{ inputs.properties }}
      run: echo "$PROPERTIES" | base64 -di > ./local.properties

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        cache-encryption-key: ${{ inputs.gradle-encryption-key }}
