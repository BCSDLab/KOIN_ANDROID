name: AI Code Review

on:
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    name: Claude AI Review
    # CodeRabbit이 approve한 후에만 실행
    if: github.event.review.user.login == 'coderabbitai[bot]' && github.event.review.state == 'approved'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Get PR Diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr_diff.txt
          wc -c pr_diff.txt

      - name: Claude AI Review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 << 'PYTHON_EOF'
          import os, json, urllib.request, urllib.error

          with open('pr_diff.txt', 'r', encoding='utf-8', errors='ignore') as f:
              diff = f.read()[:12000]  # 12000자로 제한

          payload = json.dumps({
              "model": "claude-haiku-4-5-20251001",
              "max_tokens": 2048,
              "messages": [
                  {
                      "role": "user",
                      "content": f"""You are a senior Android developer reviewing a Kotlin/Android codebase.
  Project: KOIN (한기대 커뮤니티 앱)
  Stack: Kotlin, Jetpack Compose, MVVM + Orbit MVI, Hilt, Retrofit2, Coroutines/Flow
  Architecture: Clean Architecture (UI → ViewModel → UseCase → Repository → DataSource)

  아래 PR diff를 리뷰하고 개선점을 한국어로 작성해주세요. 다음 항목을 중점적으로 확인해주세요:
  1. 코드 품질 및 정확성
  2. Android/Kotlin 모범 사례
  3. 아키텍처 준수 여부 (Clean Architecture, MVVM + Orbit MVI)
  4. 잠재적인 버그 또는 엣지 케이스
  5. 보안 취약점

  좋은 부분은 칭찬하고, 개선이 필요한 부분은 구체적인 제안과 함께 설명해주세요.

  PR Diff:
  {diff}"""
                  }
              ]
          })

          req = urllib.request.Request(
              "https://api.anthropic.com/v1/messages",
              data=payload.encode(),
              headers={
                  "Content-Type": "application/json",
                  "x-api-key": os.environ['ANTHROPIC_API_KEY'],
                  "anthropic-version": "2023-06-01"
              }
          )

          try:
              with urllib.request.urlopen(req) as response:
                  result = json.loads(response.read())
                  review_text = result["content"][0]["text"]
          except urllib.error.HTTPError as e:
              review_text = f"Claude API 호출 실패: {e.code} {e.reason}"

          with open('ai_review.txt', 'w', encoding='utf-8') as f:
              f.write(review_text)

          print(review_text)
          PYTHON_EOF

      - name: Post Review Comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVIEW=$(cat ai_review.txt)
          gh pr comment ${{ github.event.pull_request.number }} --body "## 🤖 Claude AI Code Review

  ${REVIEW}

  ---
  *이 리뷰는 Claude AI에 의해 자동 생성되었습니다. CodeRabbit 승인 후 트리거되었습니다.*"