name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create local.properties
        env:
          PROPERTIES: ${{ secrets.PROPERTIES }}
        run: echo $PROPERTIES | base64 -di > ./local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: spotless
        run: ./gradlew spotlessCheck

      - name: detekt
        run: ./gradlew detekt

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create local.properties
        env:
          PROPERTIES: ${{ secrets.PROPERTIES }}
        run: echo $PROPERTIES | base64 -di > ./local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Kover - Unit Test with Coverage
        run: ./gradlew koverXmlReport

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kover-report
          path: '**/build/reports/kover/**'
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    needs: [lint, coverage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create local.properties
        env:
          PROPERTIES: ${{ secrets.PROPERTIES }}
        run: echo $PROPERTIES | base64 -di > ./local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Update Secrets
        env:
          KOIN_STORE_PASSWORD: ${{ secrets.KOIN_STORE_PASSWORD}}
          NAVER_MAP_KEY: ${{ secrets.NAVER_MAP_KEY}}
          SECRET_KEY : ${{ secrets.SECRET_KEY }}
          PROPERTIES : ${{ secrets.PROPERTIES }}
        run: |
          echo $PROPERTIES | base64 -di > ./local.properties
          echo $SECRET_KEY | base64 -di > ./koin/team_kap_android.jks
          for file in $(find . -name 'local.properties')
          do
           echo $file
          done
          for file in $(find . -name 'team_kap_android.jks')
          do
           echo $file
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Update Firebase
        env:
          FIREBASE: ${{ secrets.FIREBASE }}
          FIREBASE_DEBUG: ${{ secrets.FIREBASE_DEBUG }}
        run: |
          mkdir -p ./koin/src/debug
          echo $FIREBASE | base64 -di > ./koin/google-services.json
          echo $FIREBASE_DEBUG | base64 -di > ./koin/src/debug/google-services.json
          for file in $(find . -name 'google-services.json')
          do
           echo $file
          done

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew build sonar