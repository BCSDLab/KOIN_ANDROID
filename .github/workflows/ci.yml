name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  get-affected-modules:
    name: Get Affected Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.affected.outputs.modules }}
      has-changes: ${{ steps.affected.outputs.has-changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected modules
        id: affected
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)

          # 빌드 설정 변경 시 전체 모듈 실행
          if echo "$CHANGED" | grep -qE '^(\.github/|gradle/|build\.gradle|settings\.gradle|build-logic/)'; then
            ALL=$(grep "include '" settings.gradle | sed "s/.*include '://;s/'//" | \
              sed 's|:|/|g' | \
              jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "modules=$ALL" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # 변경된 파일에서 모듈 추출
          MODULES=$(echo "$CHANGED" | \
            grep -E '^(koin|core|data|domain|business|feature)/' | \
            while IFS= read -r file; do
              part1=$(echo "$file" | cut -d'/' -f1)
              part2=$(echo "$file" | cut -d'/' -f2)
              if grep -qF "':${part1}:${part2}'" settings.gradle 2>/dev/null; then
                echo "${part1}:${part2}"
              else
                echo "${part1}"
              fi
            done | sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          if [ "$MODULES" = "[]" ] || [ -z "$MODULES" ]; then
            echo "has-changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "modules=$MODULES" >> $GITHUB_OUTPUT
          echo "has-changes=true" >> $GITHUB_OUTPUT

  lint:
    name: Lint (${{ matrix.module }})
    needs: get-affected-modules
    if: needs.get-affected-modules.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.get-affected-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gradle-setup
        with:
          properties: ${{ secrets.PROPERTIES }}

      - name: ktlint / spotless / detekt
        run: ./gradlew :${{ matrix.module }}:ktlintCheck :${{ matrix.module }}:spotlessCheck :${{ matrix.module }}:detekt

  coverage:
    name: Coverage (${{ matrix.module }})
    needs: get-affected-modules
    if: needs.get-affected-modules.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ${{ fromJson(needs.get-affected-modules.outputs.modules) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gradle-setup
        with:
          properties: ${{ secrets.PROPERTIES }}

      - name: Kover - Unit Test with Coverage
        run: ./gradlew :${{ matrix.module }}:koverXmlReport

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kover-report-${{ matrix.module }}
          path: '**/build/reports/kover/**'
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    needs: [lint, coverage]
    if: |
      always() &&
      (needs.lint.result == 'success' || needs.lint.result == 'skipped') &&
      (needs.coverage.result == 'success' || needs.coverage.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/gradle-setup
        with:
          properties: ${{ secrets.PROPERTIES }}

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Update Secrets
        env:
          KOIN_STORE_PASSWORD: ${{ secrets.KOIN_STORE_PASSWORD}}
          NAVER_MAP_KEY: ${{ secrets.NAVER_MAP_KEY}}
          SECRET_KEY : ${{ secrets.SECRET_KEY }}
        run: |
          echo $SECRET_KEY | base64 -di > ./koin/team_kap_android.jks
          for file in $(find . -name 'local.properties')
          do
           echo $file
          done
          for file in $(find . -name 'team_kap_android.jks')
          do
           echo $file
          done

      - name: Update Firebase
        env:
          FIREBASE: ${{ secrets.FIREBASE }}
          FIREBASE_DEBUG: ${{ secrets.FIREBASE_DEBUG }}
        run: |
          mkdir -p ./koin/src/debug
          echo $FIREBASE | base64 -di > ./koin/google-services.json
          echo $FIREBASE_DEBUG | base64 -di > ./koin/src/debug/google-services.json
          for file in $(find . -name 'google-services.json')
          do
           echo $file
          done

      - name: Lint
        run: ./gradlew lintDebug

      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          pattern: kover-report-*
          path: ./artifacts/kover
          merge-multiple: true

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          REPORT_PATHS=$(find ./artifacts/kover -name "report.xml" | paste -sd,)
          ./gradlew sonar \
            -Dsonar.coverage.jacoco.xmlReportPaths="$REPORT_PATHS" \
            -Dsonar.qualitygate.wait=true

  label:
    name: Add CI Label
    needs: [ sonarcloud ]
    runs-on: ubuntu-latest
    if: needs.sonarcloud.result == 'success'
    permissions:
      pull-requests: write
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Add Label
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['ci:passed']
            });