name: "Pick Reviewer"
on:
  pull_request:
    types: [labeled]

jobs:
  pick-reviewer:
    if: github.event.label.name == 'claude:complete'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pick reviewer
        id: pick_reviewer
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: kotlinc -script ./.github/scripts/pick_reviewer.kts "$PR_TITLE"

      - name: Add Reviewer
        uses: madrapps/add-reviewers@v1
        with:
          reviewers: ${{ steps.pick_reviewer.outputs.reviewer1 }},${{ steps.pick_reviewer.outputs.reviewer2 }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Mentor
        if: ${{ steps.pick_reviewer.outputs.mentor }}
        uses: madrapps/add-reviewers@v1
        with:
          reviewers: ${{ steps.pick_reviewer.outputs.mentor }}
          token: ${{ secrets.GITHUB_TOKEN }}
