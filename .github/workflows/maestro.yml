name: Android Maestro UI Tests

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches:
      - production
  workflow_dispatch:
jobs:
  maestro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      APP_ID: in.koreatech.koin.dev

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/gradle-setup
        with:
          properties: ${{ secrets.PROPERTIES }}

      - name: Update Secrets
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          echo $SECRET_KEY | base64 -di > ./koin/team_kap_android.jks
          for file in $(find . -name 'team_kap_android.jks')
          do
           echo $file
          done

      - name: Update Firebase
        env:
          FIREBASE: ${{ secrets.FIREBASE }}
          FIREBASE_STAGE: ${{ secrets.FIREBASE_STAGE }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          mkdir -p ./koin/src/qa
          echo "$FIREBASE" | base64 -di > ./koin/google-services.json
          echo "$FIREBASE_STAGE" | base64 -di > ./koin/src/qa/google-services.json
          echo "$GOOGLE_CREDENTIALS" | base64 -di > ./google-credentials.json 
          for file in $(find . -name 'google-services.json')
          do
           echo $file
          done
          for file in $(find . -name 'google-credentials.json')
          do
           echo $file
          done

      - name: Build QA APK with Gradle
        run: ./gradlew koin:assembleQa

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run Maestro guest tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p recordings debug-output
            adb uninstall in.koreatech.koin || true
            adb uninstall in.koreatech.koin.dev || true
            adb install -r koin/build/outputs/apk/qa/koin-qa.apk
            chmod +x .github/scripts/run_maestro_suite.sh
            bash .github/scripts/run_maestro_suite.sh ".maestro/suites/student_smoke.yaml" "student_smoke" "$APP_ID"
        env:
          USER_PASSWORD: ${{ secrets.MAESTRO_USER_PASSWORD }}

      - name: Upload Maestro test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results
          path: |
            recordings/*.mp4
            recordings/*.xml
            debug-output/**
          retention-days: 7

      - name: Upload Success to Slack
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: Android Maestro UI Tests
          text: |
            :white_check_mark: Maestro 테스트 성공
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Upload Failure to Slack
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: Android Maestro UI Tests
          text: |
            :x: Maestro 테스트 실패
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
